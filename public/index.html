<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12100e" />
  <title>Book View</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Library -->
  <main id="library-view" class="view">
    <header class="library-header">
      <h1>📚 Book View</h1>
      <label class="btn btn-primary upload-btn">
        <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden />
        + Add books
      </label>
    </header>
    <div id="upload-status" class="upload-status" hidden></div>
    <div id="book-grid" class="book-grid"></div>
    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-icon">📖</div>
      <p>Your library is empty.</p>
      <p class="muted">Tap <strong>+ Add books</strong> to upload a PDF.</p>
    </div>
  </main>

  <!-- Reader -->
  <main id="reader-view" class="view" hidden>
    <header id="reader-topbar" class="reader-bar reader-topbar">
      <button id="back-btn" class="icon-btn" aria-label="Back to library">←</button>
      <span id="reader-title" class="reader-title"></span>
      <span id="reader-pageinfo" class="reader-pageinfo"></span>
    </header>

    <div id="page-container" class="page-container">
      <div id="reader-loading" class="reader-loading">Loading…</div>
      <canvas id="page-canvas"></canvas>
    </div>

    <footer id="reader-bottombar" class="reader-bar reader-bottombar">
      <button id="zoom-out-btn" class="icon-btn" aria-label="Zoom out">−</button>
      <button id="prev-btn" class="icon-btn" aria-label="Previous page">‹</button>
      <input type="range" id="page-slider" min="1" max="1" value="1" />
      <button id="next-btn" class="icon-btn" aria-label="Next page">›</button>
      <button id="zoom-in-btn" class="icon-btn" aria-label="Zoom in">+</button>
    </footer>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
